<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webCalculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="container">
        <section id="display">
            <input type="text" class="display-input" id="display-top">
            <input type="text" class="display-input" id="display-bottom">
        </section>
        <button class="btn" id="btn-ac">AC</button>
        <button class="btn btn-operator" id="btn-braces">( )</button>
        <button class="btn btn-operator" id="btn-percent"><i class="fa-solid fa-percent"></i></button>
        <button class="btn btn-operator" id="btn-divide"><i class="fa-solid fa-divide"></i></button>
        <button class="btn btn-operand" id="btn-seven">7</button>
        <button class="btn btn-operand" id="btn-eight">8</button>
        <button class="btn btn-operand" id="btn-nine">9</button>
        <button class="btn btn-operator" id="btn-multiply"><i class="fa-solid fa-xmark"></i></button>
        <button class="btn btn-operand" id="btn-four">4</button>
        <button class="btn btn-operand" id="btn-five">5</button>
        <button class="btn btn-operand" id="btn-six">6</button>
        <button class="btn btn-operator" id="btn-minus"><i class="fa-solid fa-minus"></i></button>
        <button class="btn btn-operand" id="btn-one">1</button>
        <button class="btn btn-operand" id="btn-two">2</button>
        <button class="btn btn-operand" id="btn-three">3</button>
        <button class="btn btn-operator" id="btn-plus"><i class="fa-solid fa-plus"></i></button>
        <button class="btn btn-operand" id="btn-point"><i class="fa-solid fa-circle-dot"></i></button>
        <button class="btn btn-operand" id="btn-zero">0</button>
        <button class="btn btn-operand" id="btn-cancel"><i class="fa-solid fa-delete-left"></i></button>
        <button class="btn btn-operator" id="btn-equal"><i class="fa-solid fa-equals"></i></button>
    </div>
    <script src="script.js"></script>
</body>

</html>
