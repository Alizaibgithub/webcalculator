<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webCalculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="container">
        <section id="display">
            <input type="text" class="display-input" id="display-top">
            <input type="text" class="display-input" id="display-bottom">
        </section>
        <button class="btn" id="btn-ac" data-value="AC">AC</button>
        <button class="btn btn-operator" id="btn-braces" data-value="( )">( )</button>
        <button class="btn btn-operator" id="btn-percent" data-value="%"><i class="fa-solid fa-percent"></i></button>
        <button class="btn btn-operator" id="btn-divide" data-value="÷"><i class="fa-solid fa-divide"></i></button>
        <button class="btn btn-operand" id="btn-seven" data-value="7">7</button>
        <button class="btn btn-operand" id="btn-eight" data-value="8">8</button>
        <button class="btn btn-operand" id="btn-nine" data-value="9">9</button>
        <button class="btn btn-operator" id="btn-multiply" data-value="×"><i class="fa-solid fa-xmark"></i></button>
        <button class="btn btn-operand" id="btn-four" data-value="4">4</button>
        <button class="btn btn-operand" id="btn-five" data-value="5">5</button>
        <button class="btn btn-operand" id="btn-six" data-value="6">6</button>
        <button class="btn btn-operator" id="btn-minus" data-value="-"><i class="fa-solid fa-minus"></i></button>
        <button class="btn btn-operand" id="btn-one" data-value="1">1</button>
        <button class="btn btn-operand" id="btn-two" data-value="2">2</button>
        <button class="btn btn-operand" id="btn-three" data-value="3">3</button>
        <button class="btn btn-operator" id="btn-plus" data-value="+"><i class="fa-solid fa-plus"></i></button>
        <button class="btn btn-operand" id="btn-point" data-value="."><i class="fa-solid fa-circle-dot"></i></button>
        <button class="btn btn-operand" id="btn-zero" data-value="0">0</button>
        <button class="btn btn-operand" id="btn-cancel" data-value="DEL"><i
                class="fa-solid fa-delete-left"></i></button>
        <button class="btn btn-operator" id="btn-equal" data-value="="><i class="fa-solid fa-equals"></i></button>
    </div>
    <script src="script.js"></script>
</body>

</html>
