<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="calculator-wrapper">
        <div class="calculator-container">
            <!-- Display Section -->
            <div class="display-section">
                <input type="text" class="display-input" id="display-top" readonly>
                <input type="text" class="display-input" id="display-bottom" placeholder="0" readonly>
            </div>

            <!-- Buttons Grid -->
            <div class="buttons-grid">
                <!-- First Row: AC, (), %, ÷ -->
                <button class="btn btn-function" id="btn-ac">AC</button>
                <button class="btn btn-operator" id="btn-braces">( )</button>
                <button class="btn btn-operator" id="btn-percent">%</button>
                <button class="btn btn-operator" id="btn-divide">÷</button>

                <!-- Second Row: 7, 8, 9, × -->
                <button class="btn btn-number" id="btn-seven">7</button>
                <button class="btn btn-number" id="btn-eight">8</button>
                <button class="btn btn-number" id="btn-nine">9</button>
                <button class="btn btn-operator" id="btn-multiply">×</button>

                <!-- Third Row: 4, 5, 6, − -->
                <button class="btn btn-number" id="btn-four">4</button>
                <button class="btn btn-number" id="btn-five">5</button>
                <button class="btn btn-number" id="btn-six">6</button>
                <button class="btn btn-operator" id="btn-minus">−</button>

                <!-- Fourth Row: 1, 2, 3, + -->
                <button class="btn btn-number" id="btn-one">1</button>
                <button class="btn btn-number" id="btn-two">2</button>
                <button class="btn btn-number" id="btn-three">3</button>
                <button class="btn btn-operator" id="btn-plus">+</button>

                <!-- Fifth Row: 0, ., ⌫, = -->
                <button class="btn btn-number" id="btn-zero">0</button>
                <button class="btn btn-number" id="btn-point">.</button>
                <button class="btn btn-number" id="btn-backspace">⌫</button>
                <button class="btn btn-equal" id="btn-equal">=</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
